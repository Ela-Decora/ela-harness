name: harness (planejamento)
description: O CI do projeto de planejamento, na mesma versão do plugin que o .claude/settings.json fixa.
runs:
  using: composite
  steps:
    - name: python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: invariantes
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        export HARNESS_NUCLEO="$GITHUB_ACTION_PATH/../.."
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
          echo "::notice::sem base para comparar; invariantes puladas"
        else
          python .claude/harness/harness.py invariantes --base "$BASE" --verbose
        fi
