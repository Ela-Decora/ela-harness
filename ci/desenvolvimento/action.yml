name: harness (desenvolvimento)
description: O CI do projeto de desenvolvimento, na mesma versão do plugin que o .claude/settings.json fixa.
inputs:
  passo:
    description: Com invariantes, roda só o passo das invariantes e pula a instalação e as verificações.
    default: ""
  verificacao:
    description: O nome de uma verificação do momento finalizar. Com ele, roda só essa verificação e pula as invariantes.
    default: ""
runs:
  using: composite
  steps:
    - name: python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: git
      shell: bash
      run: |
        export HARNESS_NUCLEO="$GITHUB_ACTION_PATH/../.."
        git config --global user.name "harness-ci"
        git config --global user.email "harness-ci@users.noreply.github.com"
    - name: invariantes
      if: inputs.verificacao == ''
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        export HARNESS_NUCLEO="$GITHUB_ACTION_PATH/../.."
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
          echo "::notice::sem base para comparar; invariantes puladas"
        else
          python .claude/harness/harness.py invariantes --base "$BASE" --verbose
        fi
    - name: instalacao
      if: inputs.passo != 'invariantes'
      shell: bash
      run: |
        export HARNESS_NUCLEO="$GITHUB_ACTION_PATH/../.."
        python .claude/harness/harness.py ci instalar
    - name: verificacoes
      if: inputs.passo != 'invariantes'
      shell: bash
      env:
        SO: ${{ inputs.verificacao }}
      run: |
        export HARNESS_NUCLEO="$GITHUB_ACTION_PATH/../.."
        if [ -n "$SO" ]; then
          python .claude/harness/harness.py verificar --momento finalizar --so "$SO"
        else
          python .claude/harness/harness.py verificar --momento finalizar
        fi
